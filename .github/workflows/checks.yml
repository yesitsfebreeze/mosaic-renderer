name: Source and shader checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-build-checks:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check development checkout selection and process cancellation
        shell: pwsh
        run: python -B -m unittest discover -s tests -v
  source-and-shaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check Python build workflow
        run: python3 -B -m unittest discover -s tests -v
      - name: Install shader tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y glslang-tools libegl1 libgl1 libgl1-mesa-dri
      - name: Compile and validate Vulkan shaders
        run: python3 -B tools/build.py shaders
      - name: Exercise actual shader RLE and property fields
        run: node tests/geometry.mjs
